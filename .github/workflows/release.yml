name: Release

on:
  release:
    types:
      - published

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Package (chrome)
        run: npm run zip
      - name: Package (firefox)
        run: npm run zip:firefox
      - name: Package (safari)
        run: npm run zip:safari
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-safari.zip
            .output/*-sources.zip

